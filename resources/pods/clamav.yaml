apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-role
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
  restartPolicy: Never
  volumes:
    - name: clamav-db
      emptyDir: {}
  containers:
    - name: clamav
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/clamav/clamav@sha256:5679deab3b75aa1d2ce70b0bf474e1b4990fe5e21ed0f0f13e4ee00c80ca2a16
      command: ["cat"]
      tty: true
      volumeMounts:
        - name: clamav-db
          mountPath: /var/lib/clamav
      resources:
        requests:
          cpu: "2"
          memory: "5Gi"
          ephemeral-storage: "5Gi"
        limits:
          cpu: "2"
          memory: "5Gi"
          ephemeral-storage: "5Gi"
