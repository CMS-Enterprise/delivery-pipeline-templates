apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-agents
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: golangci-lint
      image: artifactory.cloud.cms.gov/docker/golangci/golangci-lint@sha256:f4ea5f12ca354cc8682c1c3565c358915ff9e49f7ff7aea4e253f23f1e8422dc
      command: ["cat"]
      env:
        - name: GOLANGCI_LINT_CACHE
          value: /tmp/.cache/golangci-lint
        - name: GOCACHE
          value: /tmp/.cache/go-build
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "2Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "2Gi"
