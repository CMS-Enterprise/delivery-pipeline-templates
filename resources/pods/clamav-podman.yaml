apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-agents
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: Unconfined
      # type: RuntimeDefault # This breaks podman
  restartPolicy: Never
  volumes:
    - name: clamav-db
      emptyDir: {}
  containers:
    # Flattens the image under test into a plain directory tree so clamscan can
    # walk it without mounting the image as root.
    - name: podman
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/containers/podman@sha256:eba2ce21abb42a0f0d4d9ac557587d9f0f24611873eafdf17e0eda350aec973d
      command:
        - sleep
      args:
        - infinity
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
      securityContext:
        allowPrivilegeEscalation: true # false breaks podman. allows for calling a suid program
        privileged: false
        capabilities:
          add:
            - CAP_SETUID # Needed by podman
            - CAP_SETGID # Needed by podman
    - name: clamav
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/clamav/clamav@sha256:9ec432cd3c0dda4e7f3828c8b3af48678a919d5e4f63068aa982d747a25e723f
      command: ["cat"]
      tty: true
      volumeMounts:
        - name: clamav-db
          mountPath: /var/lib/clamav
      resources:
        requests:
          cpu: "2"
          memory: "5Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "2"
          memory: "5Gi"
          ephemeral-storage: "20Gi"
