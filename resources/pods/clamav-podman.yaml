apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-agents
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: Unconfined
      # type: RuntimeDefault # This breaks podman
  restartPolicy: Never
  volumes:
    - name: clamav-db
      emptyDir: {}
  containers:
    # Flattens the image under test into a plain directory tree so clamscan can
    # walk it without mounting the image as root.
    - name: podman
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/containers/podman@sha256:243d31adc96418556098818748901f9031e1180768fee76567f3994bd327f3ba
      command:
        - sleep
      args:
        - infinity
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
      securityContext:
        allowPrivilegeEscalation: true # false breaks podman. allows for calling a suid program
        privileged: false
        capabilities:
          add:
            - CAP_SETUID # Needed by podman
            - CAP_SETGID # Needed by podman
    - name: clamav
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/clamav/clamav@sha256:1e54b46a42af97f1d311aa78eb4be39bd4839f37547e3efd6ebe01a2d94792cc
      command: ["cat"]
      tty: true
      volumeMounts:
        - name: clamav-db
          mountPath: /var/lib/clamav
      resources:
        requests:
          cpu: "2"
          memory: "5Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "2"
          memory: "5Gi"
          ephemeral-storage: "20Gi"
