apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-role
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    # Ironbank's pipeline runner carries cosign (v2) alongside a shell, which the
    # sh steps need; the upstream cosign image is distroless.
    - name: cosign
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/ironbank-pipelines/pipeline-runner-alpine@sha256:bf304d0b240cf76cf59f29a932c0d89dbf3fcf88911b8e700fe1c3b0e8a4b16e
      command: ["cat"]
      tty: true
      env:
        # cosign keeps its sigstore cache and registry config under $HOME; the
        # pod's UID has no home of its own, so point it at the writable workspace.
        - name: HOME
          value: "/home/jenkins/agent"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "256Mi"
          ephemeral-storage: "500Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
          ephemeral-storage: "500Mi"
    - name: aws-cli
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/amazon/aws-cli@sha256:b7d4f00dd6764326bc39106c74c34481e2d9f6931178980cc6db28044ecadd63
      command: ["cat"]
      tty: true
      env:
        # IRSA caches its web-identity session under $HOME/.aws; the pod's
        # UID has no home of its own, so point it at the writable workspace.
        - name: HOME
          value: "/home/jenkins/agent"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "256Mi"
          ephemeral-storage: "500Mi"
        limits:
          cpu: "500m"
          memory: "256Mi"
          ephemeral-storage: "500Mi"
