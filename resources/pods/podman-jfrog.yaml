apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-agents
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
  restartPolicy: Never
  containers:
    - name: podman
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/containers/podman@sha256:3df60a5490f23b528270f264747933274632b8576f165bc70aba209a46bbebf9
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: "4"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
    - name: jfrog-cli
      image: artifactory.cloud.cms.gov/docker/jfrog/jfrog-cli-v2-jf@sha256:9d25a4c05732074fe8d4922207d450ba526b6bd97d41a6988242a56007168935
      command: ["cat"]
      tty: true
      env:
        - name: PATH
          value: "/usr/local/bin:/usr/bin:/bin"
        - name: JFROG_CLI_HOME_DIR
          value: "/home/jenkins/agent/.jfrog"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
