apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-agents
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
  restartPolicy: Never
  containers:
    - name: podman
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/containers/podman@sha256:7bb7ce9862d63cf8a2b56ff72973d6091dab04ebc8bd25839b93b38aec03ebc6
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: "4"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
    - name: jfrog-cli
      image: artifactory.cloud.cms.gov/docker/jfrog/jfrog-cli-v2-jf@sha256:4b6f689bf0827e5897cbb2c30869af1a3d953d42336eb196be1664f0e8bdda58
      command: ["cat"]
      tty: true
      env:
        - name: PATH
          value: "/usr/local/bin:/usr/bin:/bin"
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
