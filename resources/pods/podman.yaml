apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  nodeSelector:
    node-pool: agent
  serviceAccountName: jenkins-agents
  terminationGracePeriodSeconds: 30
  hostUsers: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: Unconfined
      # type: RuntimeDefault # This breaks podman
  restartPolicy: Never
  containers:
    - name: podman
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/containers/podman@sha256:b1d685b5ce596e66f556d88c086156d00ef3c58ea6ebc062fe0994cf32d5e860
      command:
        - sleep
      args:
        - infinity
      resources:
        requests:
          cpu: "4"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "4"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
      securityContext:
        allowPrivilegeEscalation: true # false breaks podman. allows for calling a suid program
        privileged: false
        capabilities:
          add:
            - CAP_SETUID # Needed by podman
            - CAP_SETGID # Needed by podman
