apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-agents
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1030
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: jfrog-cli
      image: artifactory.cloud.cms.gov/docker/jfrog/jfrog-cli-v2@sha256:fbdae2394788e1df2042a56c569ee118648f931796138313507498bb5b6d875c
      command: ["cat"]
      tty: true
      env:
        - name: PATH
          value: "/usr/local/bin:/usr/bin:/bin"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
