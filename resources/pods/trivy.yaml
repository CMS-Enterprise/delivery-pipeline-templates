apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-role
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
  restartPolicy: Never
  containers:
    - name: trivy
      image: artifactory.cloud.cms.gov/docker/aquasec/trivy@sha256:b9e3d0c3e0c3f9d6a8e5a7c2f1b0a4d8e6c9f2a5b8d1e4f7a0c3b6d9e2f5a8b1
      command: ["cat"]
      tty: true
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
          ephemeral-storage: "5Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
          ephemeral-storage: "5Gi"
