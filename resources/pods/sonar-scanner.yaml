apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-role
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: sonar-scanner
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/sonarsource/sonar-scanner-cli@sha256:840e0808964d5a102f9c2696353f23fa850add8159d5140766a42e795f14199e
      command: ["cat"]
      tty: true
      env:
        # Fix the scanner heap so it and the JS/TS analyzer's Node.js process
        # (sized by sonar.javascript.node.maxspace in sonarqubeScan) fit the limit.
        - name: SONAR_SCANNER_JAVA_OPTS
          value: "-Xmx1g"
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "5Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "5Gi"
