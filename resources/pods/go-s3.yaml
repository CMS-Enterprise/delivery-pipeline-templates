apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  serviceAccountName: jenkins-agents
  nodeSelector:
    node-pool: agent
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  restartPolicy: Never
  containers:
    - name: go
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/google/golang/ubi9/golang-1.26@sha256:75c040632ff82e60c47f75ca96216dd51c4c51156f6067f4d1434b72b147aaa5
      command: ["cat"]
      env:
        - name: GOPROXY
          value: "https://artifactory.cloud.cms.gov/artifactory/api/go/go"
        - name: GOCACHE
          value: /tmp/.cache/go-build
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "2Gi"
        limits:
          cpu: "2"
          memory: "2Gi"
          ephemeral-storage: "2Gi"
    - name: aws-cli
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/amazon/aws-cli@sha256:a302b18401e699d23a83029632b0239144d63e51548f02b2ef670e10c7a7d52c
      command: ["cat"]
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
        limits:
          cpu: "500m"
          memory: "512Mi"
          ephemeral-storage: "1Gi"
