apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  nodeSelector:
    node-pool: agent
  serviceAccountName: jenkins-agents
  terminationGracePeriodSeconds: 30
  hostUsers: false
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: Unconfined
      # type: RuntimeDefault # This breaks podman
  restartPolicy: Never
  containers:
    # Flattens the image under test into a plain directory tree so that oscap
    # can evaluate it with oscap-chroot instead of needing a privileged mount.
    - name: podman
      image: artifactory.cloud.cms.gov/docker/podman/stable@sha256:d6f571f9dba42c692281715f4402bdd78884ff16707b08293ebe4cfdea31dbcb
      command:
        - sleep
      args:
        - infinity
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
      securityContext:
        allowPrivilegeEscalation: true # false breaks podman. allows for calling a suid program
        privileged: false
        capabilities:
          add:
            - CAP_SETUID # Needed by podman
            - CAP_SETGID # Needed by podman
    # Carries the SCAP Security Guide datastreams under
    # /usr/share/xml/scap/ssg/content/, so no content is fetched at scan time.
    - name: openscap
      image: artifactory.cloud.cms.gov/docker/compliance-as-code/openscap@sha256:3f8c1d5e7a9b2c4d6e8f0a1b3c5d7e9f2a4b6c8d0e1f3a5b7c9d2e4f6a8b0c1d
      command: ["cat"]
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
          ephemeral-storage: "10Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
          ephemeral-storage: "10Gi"
