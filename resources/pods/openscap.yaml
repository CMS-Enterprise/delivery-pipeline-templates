apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins-agent: "true"
spec:
  nodeSelector:
    node-pool: agent
  serviceAccountName: jenkins-agents
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    runAsNonRoot: true
    seccompProfile:
      type: Unconfined
      # type: RuntimeDefault # This breaks podman
  restartPolicy: Never
  containers:
    # Flattens the image under test into a plain directory tree so that oscap
    # can evaluate it with oscap-chroot instead of needing a privileged mount.
    - name: podman
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/opensource/containers/podman@sha256:7bb7ce9862d63cf8a2b56ff72973d6091dab04ebc8bd25839b93b38aec03ebc6
      command:
        - sleep
      args:
        - infinity
      resources:
        requests:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
        limits:
          cpu: "2"
          memory: "4Gi"
          ephemeral-storage: "20Gi"
      securityContext:
        allowPrivilegeEscalation: true # false breaks podman. allows for calling a suid program
        privileged: false
        capabilities:
          add:
            - CAP_SETUID # Needed by podman
            - CAP_SETGID # Needed by podman
    # Carries the SCAP Security Guide datastreams under
    # /usr/share/xml/scap/ssg/content/, so no content is fetched at scan time.
    - name: openscap
      image: artifactory.cloud.cms.gov/gi-gantuar-ironbank/ironbank/ironbank-pipelines/oscap-podman@sha256:24a219a7a815f7d0ed82b4cf4369150785ae2864cd9dcfdf5dca91d3b7fa6854
      command: ["cat"]
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: "1"
          memory: "2Gi"
          ephemeral-storage: "10Gi"
        limits:
          cpu: "1"
          memory: "2Gi"
          ephemeral-storage: "10Gi"
