---
repos:
  - repo: https://github.com/zricethezav/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-json
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: detect-private-key
      - id: pretty-format-json
        args:
          - --autofix
  - repo: https://github.com/detailyang/pre-commit-shell
    rev: 1.0.5
    hooks:
      - id: shell-lint

  # jenkinsfilelint is intentionally absent: it validates by POSTing the
  # Jenkinsfile to a running controller, so it cannot run on a workstation with
  # no reachable Jenkins. Declarative syntax is validated by CI instead.

  # Local hooks. Stage placement follows measured runtime — see process.md.
  # npm-groovy-lint is deliberately excluded from every stage: its finding
  # volume is too high to gate on, and --format corrupts PTC ${placeholders}.
  - repo: local
    hooks:
      - id: yamllint
        name: yamllint (changed files)
        entry: yamllint -c .yamllint.yml
        language: system
        files: ^(resources|templates)/.*\.ya?ml$

      - id: conftest-test
        name: conftest test (pod policy)
        entry: conftest test resources/pods/ --policy policy/ --namespace pods
        language: system
        pass_filenames: false
        files: ^(resources/pods/|policy/)

      # Whole-tree and whole-range checks. A single-file pre-commit scope cannot
      # see a policy change that breaks an unrelated pod manifest, so the full
      # runs happen here, where the developer is already pausing to publish.
      - id: yamllint-all
        name: yamllint (full tree)
        entry: yamllint -c .yamllint.yml resources/ templates/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: conftest-verify
        name: conftest verify (policy unit tests)
        entry: conftest verify --policy policy/
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: conftest-test-all
        name: conftest test (full tree)
        entry: conftest test resources/pods/ --policy policy/ --namespace pods
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: gitleaks-range
        name: Detect hardcoded secrets (push range)
        entry: scripts/gitleaks-range.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # Changed files only: 0.22s each fits a pre-push budget, where the 3.8s
      # full-tree run does not. Needs a reachable controller because declarative
      # syntax is defined by the controller's plugins; it no-ops when there
      # isn't one, so an offline push is not blocked. Full run: make
      # lint-jenkinsfiles.
      - id: jenkins-lint
        name: Validate declarative Jenkinsfiles (changed)
        entry: scripts/jenkins-lint.sh
        language: system
        files: (^|/)Jenkinsfile$
        stages: [pre-push]

      - id: gitlint
        name: Conventional commit message
        entry: gitlint --staged --msg-filename
        language: system
        stages: [commit-msg]
