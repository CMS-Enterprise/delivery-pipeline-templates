# nextjs: port 3000 and uid 1000 come from demos/nextjs/Dockerfile (EXPOSE,
# USER); / is the health path the pipeline's Image Tests use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextjs
  labels:
    app.kubernetes.io/name: nextjs
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # The rollout timeout: past this the Deployment reports
  # ProgressDeadlineExceeded, which fails the Flux health check.
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: nextjs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextjs
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: jfrog-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nextjs
          # Placeholder name and tag; the overlay's images: entry, maintained by
          # gitopsPromote, supplies the Artifactory repository and tag.
          image: nextjs:set-by-pipeline
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            # Read-only root; the paths the app writes to are emptyDir mounts.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /home/node/app/.next/cache
          # Fargate sizes the pod from requests, so limits match them.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
        - name: next-cache
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: nextjs
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextjs
---
apiVersion: v1
kind: Service
metadata:
  name: nextjs
  labels:
    app.kubernetes.io/name: nextjs
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: nextjs
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Fargate has no nodes for NodePort or instance targets, so the ALB registers
# pod IPs directly. All seven share one internal ALB through group.name; the
# certificate is discovered from ACM by the TLS host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nextjs
  labels:
    app.kubernetes.io/name: nextjs
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: delivery-demos
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - nextjs.example.invalid
  rules:
    # Host set per environment by the overlay.
    - host: nextjs.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nextjs
                port:
                  name: http
