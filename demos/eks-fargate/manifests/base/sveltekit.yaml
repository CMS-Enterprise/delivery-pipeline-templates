# sveltekit: port 3002 and uid 1000 come from demos/sveltekit/Dockerfile (EXPOSE,
# USER); / is the health path the pipeline's Image Tests use.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sveltekit
  labels:
    app.kubernetes.io/name: sveltekit
spec:
  replicas: 2
  revisionHistoryLimit: 5
  # The rollout timeout: past this the Deployment reports
  # ProgressDeadlineExceeded, which fails the Flux health check.
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: sveltekit
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sveltekit
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: jfrog-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sveltekit
          # Placeholder name and tag; the overlay's images: entry, maintained by
          # gitopsPromote, supplies the Artifactory repository and tag.
          image: sveltekit:set-by-pipeline
          ports:
            - name: http
              containerPort: 3002
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            # Read-only root; the paths the app writes to are emptyDir mounts.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          # Fargate sizes the pod from requests, so limits match them.
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 250m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: sveltekit
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sveltekit
---
apiVersion: v1
kind: Service
metadata:
  name: sveltekit
  labels:
    app.kubernetes.io/name: sveltekit
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sveltekit
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# Fargate has no nodes for NodePort or instance targets, so the ALB registers
# pod IPs directly. All seven share one internal ALB through group.name; the
# certificate is discovered from ACM by the TLS host.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sveltekit
  labels:
    app.kubernetes.io/name: sveltekit
  annotations:
    alb.ingress.kubernetes.io/scheme: internal
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: delivery-demos
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/success-codes: "200"
spec:
  ingressClassName: alb
  tls:
    - hosts:
        - sveltekit.example.invalid
  rules:
    # Host set per environment by the overlay.
    - host: sveltekit.example.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sveltekit
                port:
                  name: http
