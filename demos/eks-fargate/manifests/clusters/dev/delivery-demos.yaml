# Flux reconciles overlays/dev of this repository (delivery-pipeline-manifests)
# into the dev cluster. flux-system is the GitRepository `flux bootstrap`
# creates for the same repository; see the README.
#
# wait: true makes the Kustomization Ready only once every Deployment has
# rolled out, and timeout bounds that wait. A Deployment that passes its
# progressDeadlineSeconds fails the health check before the timeout.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: delivery-demos-dev
  namespace: flux-system
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./overlays/dev
  prune: true
  wait: true
