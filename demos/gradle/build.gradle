plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'checkstyle'
}

group = 'com.example'
version = '1.0.0'

java {
    sourceCompatibility = '25'
}

repositories {
    maven {
        url 'https://artifactory.cloud.cms.gov/artifactory/maven-public'
        allowInsecureProtocol = false
        // Authenticated when the pipeline supplies jfrog-credentials;
        // anonymous otherwise. Anonymous access only serves artifacts
        // Artifactory has already cached and answers 401 for the rest.
        if (System.getenv('ARTIFACTORY_USER')) {
            credentials {
                username = System.getenv('ARTIFACTORY_USER')
                password = System.getenv('ARTIFACTORY_TOKEN')
            }
        }
    }
}

// Spring Boot 4.1.3 still manages Tomcat 11.0.27, which grype flags
// (CVE-2026-116561, CVE-2026-118028 and others, fixed in 11.0.29). Drop this
// override once the Boot plugin manages 11.0.29 or later.
ext['tomcat.version'] = '11.0.29'

// Every resolved version is pinned in gradle.lockfile; a dependency that is not
// in it fails resolution. After changing dependencies, regenerate it with
// `gradle dependencies --write-locks` and commit the result.
dependencyLocking {
    lockAllConfigurations()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('io.cucumber:cucumber-bom:8.0.4')
    testImplementation 'io.cucumber:cucumber-java'
    testImplementation 'io.cucumber:cucumber-spring'
    testImplementation 'io.cucumber:cucumber-junit-platform-engine'
    testImplementation 'org.junit.platform:junit-platform-suite'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Unit tests and Cucumber scenarios run as separate tasks so each reports on
// its own; the suite engine only discovers RunCucumberTest.
tasks.named('test') {
    useJUnitPlatform {
        excludeEngines 'junit-platform-suite'
    }
}

// Reproducible builds: archives (including bootJar) get fixed entry timestamps
// and a stable entry order, so the same sources produce the same jar.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.register('cucumber', Test) {
    description = 'Runs the Cucumber acceptance scenarios.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeEngines 'junit-platform-suite'
    }
    def tags = System.getProperty('cucumber.filter.tags')
    if (tags) {
        systemProperty 'cucumber.filter.tags', tags
    }
}

checkstyle {
    configFile = file('checkstyle.xml')
    toolVersion = '10.12.5'
}
