<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | RoboCare Health'">RoboCare Health</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav th:fragment="nav">
    <div class="nav-container">
        <a href="/" class="nav-brand">RoboCare Health</a>
        <ul class="nav-links">
            <li><a th:href="@{/}" th:classappend="${pageTitle == 'Home'} ? 'active'">Home</a></li>
            <li><a th:href="@{/about}" th:classappend="${pageTitle == 'About'} ? 'active'">About</a></li>
        </ul>
    </div>
</nav>

<main th:fragment="content">
    <div class="container">
    </div>
</main>

<footer th:fragment="footer">
    <div class="container">
        <p>&copy; 2026 RoboCare Health. Advancing healthcare through robotics.</p>
    </div>
</footer>

</body>
</html>
