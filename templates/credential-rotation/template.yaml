version: 1
type: pipeline-template
name: credential-rotation
displayName: Credential Rotation Pipeline
description: >-
  Updates Jenkins credentials on a schedule. Most are pulled from AWS Secrets
  Manager; the SonarQube token is rotated against SonarQube itself (generate,
  validate, store, then revoke earlier tokens).
parameters:
  - name: rotation_scope
    displayName: Rotation Scope
    description: "Which credentials to rotate"
    type: string
    defaultValue: all
    allowedValues:
      - all
      - snyk
      - jfrog
      - slack
      - npm
      - sonarqube
      - argocd
      - terraform
      - jira
      - github
  - name: dry_run
    displayName: Dry Run
    description: "Validate Secrets Manager connectivity without updating Jenkins credentials"
    type: boolean
    defaultValue: false
  - name: force
    displayName: Force Rotation
    description: "Rotate even if credential has not expired"
    type: boolean
    defaultValue: false
  - name: aws_region
    displayName: AWS Region
    type: string
    defaultValue: us-east-1
  - name: aws_account_credential
    displayName: AWS Account ID Credential
    type: credentials
    defaultValue: aws-account-id-prod
  - name: slack_channel
    displayName: Slack Notification Channel
    type: string
    defaultValue: "#platform-security"
  - name: slack_webhook_credential
    displayName: Slack Webhook Credential
    type: credentials
    defaultValue: slack-webhook-url
  - name: sonarqube_url
    displayName: SonarQube URL
    type: string
    defaultValue: https://sonarqube.cloud.cms.gov
  - name: sonarqube_token_prefix
    displayName: SonarQube Token Name Prefix
    description: >-
      Name prefix of the tokens this job generates; earlier tokens with this
      prefix are revoked after each rotation. Seed the first token under it.
    type: string
    defaultValue: jenkins-ci-sonarqube
  - name: sonarqube_token_days
    displayName: SonarQube Token Lifetime (days)
    description: Expiration set on each generated token. Rotation runs twice a month.
    type: string
    defaultValue: "90"
